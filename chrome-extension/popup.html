<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TruthWeave</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 380px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #D6EBF3;
      padding: 0;
      color: #152A35;
    }

    .header {
      background: linear-gradient(135deg, #447F98 0%, #629BB5 100%);
      color: white;
      padding: 16px 20px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(68, 127, 152, 0.3);
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
      position: relative;
      z-index: 1;
      letter-spacing: 0.5px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.95;
      position: relative;
      z-index: 1;
      font-weight: 500;
    }

    .container {
      padding: 20px;
      background: #D6EBF3;
    }

    .input-section {
      margin-bottom: 16px;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      padding: 12px;
      border: 1px solid rgba(218, 222, 225, 0.8);
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      transition: all 0.3s;
      background: #D6EBF3;
      box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.8),
                  inset 4px 4px 8px rgba(98, 155, 181, 0.3);
      color: #152A35;
    }

    textarea:focus {
      outline: none;
      border-color: #447F98;
      box-shadow: inset -4px -4px 8px rgba(255, 255, 255, 0.9),
                  inset 4px 4px 8px rgba(68, 127, 152, 0.25);
    }

    textarea::placeholder {
      color: #728F9E;
    }

    .button-group {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    button {
      flex: 1;
      padding: 12px;
      background: linear-gradient(135deg, #447F98 0%, #629BB5 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: -5px -5px 10px rgba(255, 255, 255, 0.85),
                  5px 5px 10px rgba(98, 155, 181, 0.35);
      position: relative;
      overflow: hidden;
    }

    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.5s;
    }

    button:hover::before {
      left: 100%;
    }

    button:hover {
      background: linear-gradient(135deg, #629BB5 0%, #447F98 100%);
      transform: translateY(-2px);
      box-shadow: -7px -7px 14px rgba(255, 255, 255, 0.9),
                  7px 7px 14px rgba(98, 155, 181, 0.4),
                  0 4px 16px rgba(68, 127, 152, 0.3);
    }

    button:active {
      transform: translateY(0);
      box-shadow: inset -4px -4px 8px rgba(68, 127, 152, 0.4),
                  inset 4px 4px 8px rgba(98, 155, 181, 0.6);
    }

    button:disabled {
      background: #DADEE1;
      color: #8C9CA4;
      cursor: not-allowed;
      transform: none;
      box-shadow: -3px -3px 6px rgba(255, 255, 255, 0.6),
                  3px 3px 6px rgba(98, 155, 181, 0.2);
    }

    .secondary-btn {
      background: #D6EBF3;
      color: #447F98;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: -5px -5px 10px rgba(255, 255, 255, 0.8),
                  5px 5px 10px rgba(98, 155, 181, 0.3);
    }

    .secondary-btn:hover {
      background: #E8F4F9;
      color: #35667B;
      box-shadow: -7px -7px 14px rgba(255, 255, 255, 0.9),
                  7px 7px 14px rgba(98, 155, 181, 0.4);
    }

    .secondary-btn:active {
      box-shadow: inset -3px -3px 6px rgba(255, 255, 255, 0.7),
                  inset 3px 3px 6px rgba(98, 155, 181, 0.3);
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #447F98;
      font-weight: 600;
    }

    .spinner {
      border: 3px solid #B9D8E1;
      border-top: 3px solid #447F98;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 12px;
      box-shadow: -4px -4px 8px rgba(255, 255, 255, 0.8),
                  4px 4px 8px rgba(98, 155, 181, 0.3);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .results {
      background: #D6EBF3;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: -6px -6px 14px rgba(255, 255, 255, 0.85),
                  6px 6px 14px rgba(98, 155, 181, 0.35);
    }

    .verdict {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .verdict.true {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .verdict.false {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    .verdict.misleading, .verdict.unverifiable {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }

    .explanation {
      font-size: 13px;
      line-height: 1.6;
      color: #152A35;
      margin-bottom: 12px;
      padding: 12px;
      background: #D6EBF3;
      border-radius: 12px;
      border-left: 3px solid #447F98;
      box-shadow: inset -2px -2px 5px rgba(255, 255, 255, 0.8),
                  inset 2px 2px 5px rgba(98, 155, 181, 0.3);
    }

    .verified-info {
      font-size: 13px;
      margin-bottom: 12px;
      padding: 12px;
      background: #D6EBF3;
      border-radius: 12px;
      box-shadow: inset -2px -2px 5px rgba(255, 255, 255, 0.8),
                  inset 2px 2px 5px rgba(98, 155, 181, 0.3);
    }

    .verified-info strong {
      color: #447F98;
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .sources {
      font-size: 12px;
    }

    .sources strong {
      display: block;
      margin-bottom: 8px;
      color: #447F98;
      font-weight: 700;
    }

    .sources a {
      display: block;
      color: #447F98;
      text-decoration: none;
      padding: 8px 10px;
      margin-bottom: 6px;
      background: #D6EBF3;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      transition: all 0.3s;
      word-break: break-all;
      box-shadow: -3px -3px 6px rgba(255, 255, 255, 0.8),
                  3px 3px 6px rgba(98, 155, 181, 0.25);
      font-weight: 500;
    }

    .sources a:hover {
      background: linear-gradient(135deg, #447F98 0%, #629BB5 100%);
      color: white;
      transform: translateX(4px);
      box-shadow: -5px -5px 10px rgba(255, 255, 255, 0.9),
                  5px 5px 10px rgba(98, 155, 181, 0.35),
                  0 2px 12px rgba(68, 127, 152, 0.3);
    }

    .error {
      background: linear-gradient(135deg, #fecaca 0%, #fca5a5 100%);
      color: #991b1b;
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      border-left: 3px solid #dc2626;
      box-shadow: -4px -4px 8px rgba(255, 255, 255, 0.8),
                  4px 4px 8px rgba(98, 155, 181, 0.25);
      font-weight: 500;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>TruthWeave</h1>
    <p>AI-Powered Fact Checker</p>
  </div>

  <div class="container">
    <div class="input-section">
      <textarea id="claimInput" placeholder="Paste a claim or text to verify..."></textarea>
    </div>

    <div class="button-group">
      <button id="analyzeBtn">Analyze Claim</button>
      <button id="analyzeSelectedBtn" class="secondary-btn">Analyze Selected</button>
    </div>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>Analyzing claim...</p>
    </div>

    <div id="results" class="hidden"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
